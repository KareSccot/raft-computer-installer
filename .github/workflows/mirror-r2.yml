name: Mirror R2 artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts from R2
        run: |
          set -eu
          BASE="https://hands.build/dl/raft-computer-cli/releases/fdaf8c9b-ac80-4edf-b5dd-31f6af48a49d/darwin-arm64.gz"
          MAIN_LOC=$(curl -sSI "$BASE" | sed -n "s/^[Ll]ocation: *//p" | tr -d "\\r")
          echo "resolved ${#MAIN_LOC} chars"
          test -n "$MAIN_LOC"
          echo "$MAIN_LOC" > presigned.txt
          CODE=$(curl -sS --globoff -o body.bin -w "%{http_code}" "$MAIN_LOC" || true)
          echo "curl http:$CODE size:$(stat -c%s body.bin)"
          if [ "$CODE" = "200" ]; then
            mv body.bin raft-computer-darwin-arm64.gz
            gunzip -t raft-computer-darwin-arm64.gz
            sha256sum raft-computer-darwin-arm64.gz
            exit 0
          fi
          echo "--- full body ---"
          cat body.bin || true
          echo
          echo "--- wget attempt ---"
          wget -q -O w.bin "$(cat presigned.txt)" && echo "wget OK $(stat -c%s w.bin)" || echo "wget failed rc=$?"
          echo "--- python attempt ---"
          python3 -c "import sys,urllib.request; u=open('presigned.txt').read().strip(); d=urllib.request.urlopen(u,timeout=120).read(); print('py OK',len(d)); open('raft-computer-darwin-arm64.gz','wb').write(d)"
          gunzip -t raft-computer-darwin-arm64.gz
          sha256sum raft-computer-darwin-arm64.gz
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r2-mirror
          path: raft-computer-darwin-arm64.gz
          retention-days: 1
