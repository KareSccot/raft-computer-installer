name: Mirror R2 artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts from R2
        run: |
          set -eu
          BASE="https://hands.build/dl/raft-computer-cli/releases/fdaf8c9b-ac80-4edf-b5dd-31f6af48a49d/darwin-arm64.gz"
          MAIN_LOC=$(curl -sSI "$BASE" | sed -n 's/^[Ll]ocation: *//p' | tr -d '\r')
          echo "resolved ${#MAIN_LOC} chars"
          test -n "$MAIN_LOC"
          CODE=$(curl -sS --retry 2 -o body.bin -w "%{http_code}" "$MAIN_LOC" || true)
          echo "http:$CODE size:$(stat -c%s body.bin)"
          if [ "$CODE" != "200" ]; then
            echo "--- body head ---"
            head -c 800 body.bin || true
            echo
            echo "--- try without query / with UA ---"
            curl -sS -A "raft-computer-installer/0.3.22" -o body2.bin -w "with-UA http:%{http_code}\n" "$MAIN_LOC" || true
            head -c 400 body2.bin || true
            exit 1
          fi
          mv body.bin raft-computer-darwin-arm64.gz
          gunzip -t raft-computer-darwin-arm64.gz
          sha256sum raft-computer-darwin-arm64.gz
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r2-mirror
          path: raft-computer-darwin-arm64.gz
          retention-days: 1
